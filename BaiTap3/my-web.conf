server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/my-web/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cấu hình Custom Error Page 404
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    # Cấu hình bảo mật thư mục /admin bằng HTTP Basic Auth
    location /admin {
        auth_basic "Restricted Admin Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }
}
