# Cấu hình Beta App lắng nghe cổng 8080
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/beta-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}

# Cấu hình Internal App lắng nghe cổng 8090
server {
    listen 8090;
    listen [::]:8090;
    server_name _;

    root /var/www/internal-app/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
